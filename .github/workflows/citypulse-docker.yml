name: CityPulse Docker smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'citypulse/**'
      - '.github/workflows/citypulse-docker.yml'
concurrency:
  group: citypulse-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker and Compose
        run: |
          docker version
          docker compose version
      - name: Generate throwaway development credentials
        run: |
          umask 077
          {
            echo "CITYPULSE_POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "CITYPULSE_ADMIN_EMAIL=admin@example.invalid"
            echo "CITYPULSE_ADMIN_PASSWORD=$(openssl rand -hex 24)"
          } > citypulse/.env
      - name: Check config generator syntax
        run: python3 -m py_compile citypulse/generate_config.py
      - name: Generate matching FixMyStreet database config
        run: |
          set -a
          . citypulse/.env
          set +a
          python3 citypulse/generate_config.py
          test -f citypulse/general.yml
          test ! -d citypulse/general.yml
          test -s citypulse/general.yml
          python3 - <<'PY'
          from pathlib import Path
          import os
          config = Path('citypulse/general.yml').read_text()
          assert 'FMS_DB_PASS: ' in config
          assert "FMS_DB_PASS: 'fms'" not in config
          assert Path('citypulse/general.yml').is_file()
          print('Generated application config verified')
          PY
      - name: Validate Compose configuration
        run: docker compose --env-file citypulse/.env -f citypulse/compose.dev.yml config --quiet
      - name: Pull upstream container images
        run: docker compose --env-file citypulse/.env -f citypulse/compose.dev.yml pull
      - name: Verify generated config mount source
        run: |
          test -f citypulse/general.yml || { echo 'Missing generated general.yml'; exit 1; }
          stat citypulse/general.yml
      - name: Start local stack
        run: docker compose --env-file citypulse/.env -f citypulse/compose.dev.yml up -d
      - name: Probe app HTTP response
        run: |
          for i in $(seq 1 36); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/ -o /tmp/citypulse-response.html; then
              echo "HTTP check successful"
              exit 0
            fi
            sleep 5
          done
          echo "App did not return HTTP 2xx during the allotted period"
          exit 1
      - name: Collect service status on failure
        if: failure()
        run: |
          docker compose --env-file citypulse/.env -f citypulse/compose.dev.yml ps || true
          docker compose --env-file citypulse/.env -f citypulse/compose.dev.yml logs --tail 80 --no-color || true
      - name: Shut down temporary stack
        if: always()
        run: |
          docker compose --env-file citypulse/.env -f citypulse/compose.dev.yml down --remove-orphans || true
          rm -f citypulse/.env citypulse/general.yml
