# Development deployment using original FixMyStreet image and config.
# WARNING: Password substitution does not automatically create the FMS PostgreSQL role.
# Follow upstream first-run database initialization instructions.
services:
  nginx:
    image: nginx:1.27.2
    depends_on: [fixmystreet]
    ports: ["127.0.0.1:8000:80"]
    volumes:
      - ../conf/nginx.conf-docker:/etc/nginx/conf.d/default.conf:ro
  fixmystreet:
    image: fixmystreet/fixmystreet:stable
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
    stop_signal: SIGRTMIN+3
    cgroup: host
    volumes:
      - ../conf/general.yml-docker:/var/www/fixmystreet/fixmystreet/conf/general.yml:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run:size=100m
      - /run/lock:size=100m
    environment:
      FMS_DB_HOST: postgres
      FMS_DB_NAME: fixmystreet
      FMS_DB_USER: fms
      FMS_DB_PASS: ${CITYPULSE_FMS_DB_PASSWORD:?set application db password}
      FMS_ROOT: /var/www/fixmystreet/fixmystreet
      SUPERUSER_EMAIL: ${CITYPULSE_ADMIN_EMAIL:?set admin email}
      SUPERUSER_PASSWORD: ${CITYPULSE_ADMIN_PASSWORD:?set admin password}
  postgres:
    image: postgres:13.11
    environment:
      POSTGRES_PASSWORD: ${CITYPULSE_POSTGRES_PASSWORD:?set database password}
      POSTGRES_DB: fixmystreet
      POSTGRES_USER: fms
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - citypulse-pgdata:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fms -d fixmystreet"]
      interval: 5s
      timeout: 5s
      retries: 10
  memcached:
    image: memcached:1.6.32
volumes:
  citypulse-pgdata:
